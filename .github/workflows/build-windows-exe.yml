name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/main/cpp/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Compile unchanged source
        shell: msys2 {0}
        run: g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ src/main/cpp/KillAura.cpp -o KillAura.exe
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KillAura-windows-exe
          path: KillAura.exe
          if-no-files-found: error
