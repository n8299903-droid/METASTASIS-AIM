plugins {
    id 'java'
    id 'application'
}

group = 'dev.seraph'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'dev.seraph.metastasis.Main'
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}
